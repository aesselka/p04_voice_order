- id: task_scenario_combo
  tags: [combo, remove, reference, ru, task]
  turns: ["Два комбо", "Колу", "Картошку фри", "Средний", "Второе убери", "И колу отдельно", "Колу сделай большой"]
  expect:
    cart:
      - {item: combo, qty: 1, choices: {drink: cola, side: fries, size: M}}
      - {item: cola, qty: 1, size: L}
    questions: 3

