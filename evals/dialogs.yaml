# Эталонные диалоги (golden set). Каждый = новый гость, реплики по порядку.
#
#   expect.cart       итоговая корзина; порядок строк не важен.
#                     size для напитков/кофе/фри: если гость не назвал — M (размер по умолчанию)
#                     mods: {modifier_id: add|remove}, choices: {choice_id: value} — для комбо
#   expect.status     open (по умолчанию) | confirmed | cancelled
#   expect.questions  сколько уточняющих вопросов НУЖНО задать за диалог.
#                     Больше — «лишние уточнения», меньше — система что-то угадала молча.
#
# Правило команды: каждый найденный баг -> новый диалог сюда (тег regression).

- id: add_simple
  tags: [add, ru]
  turns: ["Один бургер, пожалуйста"]
  expect: {cart: [{item: burger, qty: 1}]}

- id: add_two_items
  tags: [add, ru]
  turns: ["Мне два чизбургера... то есть два бургера и большую колу"]
  expect: {cart: [{item: burger, qty: 2}, {item: cola, qty: 1, size: L}]}

- id: add_three_items
  tags: [add, ru]
  turns: ["Наггетсы, салат и апельсиновый сок"]
  expect: {cart: [{item: nuggets, qty: 1}, {item: salad, qty: 1}, {item: juice_orange, qty: 1}]}

- id: add_mods
  tags: [add, mods, ru]
  turns: ["Чикен бургер без лука и с сыром"]
  expect: {cart: [{item: chicken_burger, qty: 1, mods: {onion: remove, cheese: add}}]}

- id: add_default_size
  tags: [add, ru]
  turns: ["Латте"]
  expect: {cart: [{item: latte, qty: 1, size: M}]}

- id: add_numbers_as_words
  tags: [add, ru]
  turns: ["Три воды и пять мороженых"]
  expect: {cart: [{item: water, qty: 3}, {item: ice_cream, qty: 5}]}

- id: remove_ordinal_line
  tags: [remove, reference, ru]
  turns: ["Бургер", "Фанту", "Наггетсы", "Второе убери"]
  expect: {cart: [{item: burger, qty: 1}, {item: nuggets, qty: 1}]}

- id: remove_last
  tags: [remove, reference, ru]
